name: Solution stats

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_wait:
        description: Generate immediately instead of waiting for the quiet period
        type: boolean
        default: true

permissions:
  contents: write

# Every new push cancels the previous wait/run and starts a fresh quiet period.
concurrency:
  group: solution-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stats:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Wait for a pause in commits
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_wait
        env:
          STATS_DEBOUNCE_SECONDS: ${{ vars.STATS_DEBOUNCE_SECONDS || '300' }}
        run: |
          python3 - <<'PY'
          import os
          import time

          try:
              seconds = int(os.environ["STATS_DEBOUNCE_SECONDS"])
          except ValueError:
              raise SystemExit("STATS_DEBOUNCE_SECONDS must be an integer from 0 to 900")
          if not 0 <= seconds <= 900:
              raise SystemExit("STATS_DEBOUNCE_SECONDS must be an integer from 0 to 900")
          print(f"Waiting {seconds} seconds; a new push restarts this wait.", flush=True)
          time.sleep(seconds)
          PY

      - name: Check out the latest main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Check the stats generator
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Generate stats and highlights
        run: python3 .github/scripts/solution_stats.py

      - name: Publish changed stats
        run: |
          git add -- README.md stats/solutions.json
          if git diff --cached --quiet; then
            echo "Stats are unchanged."
            exit 0
          fi

          source_sha=$(git rev-parse HEAD)
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$source_sha" ]]; then
            echo "Main advanced while generating stats; leaving it to the newer run."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update solution stats'
          if ! git push origin HEAD:main; then
            git fetch origin main
            if [[ "$(git rev-parse origin/main)" != "$source_sha" ]]; then
              echo "Main advanced before the push; leaving it to the newer run."
              exit 0
            fi
            echo '::error::Could not publish stats. Check Actions write access and main branch rules.'
            exit 1
          fi
